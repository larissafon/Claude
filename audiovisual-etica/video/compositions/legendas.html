<template id="legendas-template">
  <div data-composition-id="legendas" data-width="1920" data-height="1080" data-duration="572.81">
    <div class="lg-area">
      <div class="lg" id="lg0"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Toda semana, alguma decisão pública chega até nós embalada em números:</span></div>
      <div class="lg" id="lg1"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">crescimento, custo, eficiência.</span></div>
      <div class="lg" id="lg2"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">E quase sempre vem acompanhada de uma frase:</span></div>
      <div class="lg" id="lg3"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">essa é a escolha economicamente correta.</span></div>
      <div class="lg" id="lg4"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Mas o que exatamente essa frase está dizendo?</span></div>
      <div class="lg" id="lg5"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Ela descreve o mundo, ou já está decidindo por nós como ele deve ser?</span></div>
      <div class="lg" id="lg6"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Este audiovisual parte de uma pergunta simples:</span></div>
      <div class="lg" id="lg7"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">quando a economia diz o que devemos fazer?</span></div>
      <div class="lg" id="lg8"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Tenho aqui uma proposta.</span></div>
      <div class="lg" id="lg9"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Segundo o nosso modelo, esta política aumenta a renda total do país.</span></div>
      <div class="lg" id="lg10"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">A economia cresce, a riqueza aumenta.</span></div>
      <div class="lg" id="lg11"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">E quem fica com essa riqueza?</span></div>
      <div class="lg" id="lg12"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Bom...</span></div>
      <div class="lg" id="lg13"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">o modelo também indica que a desigualdade aumenta.</span></div>
      <div class="lg" id="lg14"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Os mais ricos ganham bem mais que os mais pobres.</span></div>
      <div class="lg" id="lg15"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Mas, no agregado, todos poderiam estar melhor.</span></div>
      <div class="lg" id="lg16"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Poderiam.</span></div>
      <div class="lg" id="lg17"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Mas vão estar?</span></div>
      <div class="lg" id="lg18"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Você diz que é eficiente.</span></div>
      <div class="lg" id="lg19"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Eficiente para quem?</span></div>
      <div class="lg" id="lg20"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Riqueza maior, desigualdade maior.</span></div>
      <div class="lg" id="lg21"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">É uma boa política?</span></div>
      <div class="lg" id="lg22"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Repare que os números não respondem a isso sozinhos.</span></div>
      <div class="lg" id="lg23"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Para responder, precisamos dizer o que consideramos bom.</span></div>
      <div class="lg" id="lg24"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Existem dois tipos de frase nessa conversa.</span></div>
      <div class="lg" id="lg25"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">A primeira:</span></div>
      <div class="lg" id="lg26"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">a política aumenta o PIB em X por cento.</span></div>
      <div class="lg" id="lg27"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Ela pode ser testada:</span></div>
      <div class="lg" id="lg28"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">os dados confirmam ou não.</span></div>
      <div class="lg" id="lg29"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">É uma afirmação sobre o que é.</span></div>
      <div class="lg" id="lg30"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">A segunda:</span></div>
      <div class="lg" id="lg31"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">devemos escolher essa política.</span></div>
      <div class="lg" id="lg32"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Nenhum dado, sozinho, confirma essa frase.</span></div>
      <div class="lg" id="lg33"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Ela depende do que valorizamos:</span></div>
      <div class="lg" id="lg34"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">crescimento, igualdade, liberdade, segurança.</span></div>
      <div class="lg" id="lg35"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">É uma afirmação sobre o que deve ser.</span></div>
      <div class="lg" id="lg36"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">No século dezoito, o filósofo David Hume já apontava que não se</span></div>
      <div class="lg" id="lg37"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">chega a um deve partindo apenas de um é.</span></div>
      <div class="lg" id="lg38"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Na economia, essa separação aparece como a distinção entre</span></div>
      <div class="lg" id="lg39"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">economia positiva, que descreve, e economia normativa, que prescreve.</span></div>
      <div class="lg" id="lg40"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Então meu trabalho é só a parte positiva.</span></div>
      <div class="lg" id="lg41"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Eu mostro as consequências;</span></div>
      <div class="lg" id="lg42"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">quem decide são os outros.</span></div>
      <div class="lg" id="lg43"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Será?</span></div>
      <div class="lg" id="lg44"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Vamos ver se é tão simples assim.</span></div>
      <div class="lg" id="lg45"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Para avançar, vale distinguir duas palavras que costumamos usar como sinônimos.</span></div>
      <div class="lg" id="lg46"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Moral são os valores vividos:</span></div>
      <div class="lg" id="lg47"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">os costumes, as regras e as convicções que orientam o que uma</span></div>
      <div class="lg" id="lg48"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">sociedade considera certo ou errado no dia a dia.</span></div>
      <div class="lg" id="lg49"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Ética é a reflexão sobre esses valores:</span></div>
      <div class="lg" id="lg50"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">perguntar por que os seguimos, se fazem sentido e a quem servem.</span></div>
      <div class="lg" id="lg51"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Quando o cidadão pergunta eficiente para quem, ele está fazendo exatamente isso:</span></div>
      <div class="lg" id="lg52"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">trazendo a reflexão ética para dentro de uma conversa que parecia apenas técnica.</span></div>
      <div class="lg" id="lg53"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Me responde uma coisa.</span></div>
      <div class="lg" id="lg54"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">A economia diz que estuda como satisfazer as necessidades das pessoas.</span></div>
      <div class="lg" id="lg55"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Mas o que é uma necessidade?</span></div>
      <div class="lg" id="lg56"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Alimentação, moradia, saúde.</span></div>
      <div class="lg" id="lg57"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Isso é básico.</span></div>
      <div class="lg" id="lg58"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">E um celular?</span></div>
      <div class="lg" id="lg59"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Hoje, sem celular, eu não consigo procurar emprego, falar</span></div>
      <div class="lg" id="lg60"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">com a escola do meu filho, acessar o banco.</span></div>
      <div class="lg" id="lg61"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Hum...</span></div>
      <div class="lg" id="lg62"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">talvez seja uma necessidade, então.</span></div>
      <div class="lg" id="lg63"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">E uma viagem de férias?</span></div>
      <div class="lg" id="lg64"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Aí já é um desejo.</span></div>
      <div class="lg" id="lg65"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Para quem?</span></div>
      <div class="lg" id="lg66"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Quem decide onde termina a necessidade e começa o desejo?</span></div>
      <div class="lg" id="lg67"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Podemos separar três ideias.</span></div>
      <div class="lg" id="lg68"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Necessidades são condições para viver com dignidade em uma determinada sociedade e época.</span></div>
      <div class="lg" id="lg69"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Desejos são moldados pela cultura, pela publicidade, pelo que é visto como normal ou desejável.</span></div>
      <div class="lg" id="lg70"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">E demanda é outra coisa:</span></div>
      <div class="lg" id="lg71"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">é o desejo sustentado por poder de compra.</span></div>
      <div class="lg" id="lg72"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Adam Smith já distinguia a simples vontade de ter</span></div>
      <div class="lg" id="lg73"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">algo da demanda efetiva, aquela de quem pode pagar.</span></div>
      <div class="lg" id="lg74"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Aqui está o ponto:</span></div>
      <div class="lg" id="lg75"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">o mercado responde à demanda, não à necessidade.</span></div>
      <div class="lg" id="lg76"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Uma pessoa com fome e sem dinheiro não aparece na curva de demanda.</span></div>
      <div class="lg" id="lg77"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Se a economia olha apenas para o que é</span></div>
      <div class="lg" id="lg78"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">demandado, quem não pode pagar simplesmente some da análise.</span></div>
      <div class="lg" id="lg79"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Voltemos ao economista que dizia apenas descrever.</span></div>
      <div class="lg" id="lg80"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Antes de qualquer cálculo, ele precisa decidir:</span></div>
      <div class="lg" id="lg81"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">o que vou medir?</span></div>
      <div class="lg" id="lg82"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Qual indicador vai representar estar melhor?</span></div>
      <div class="lg" id="lg83"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Um exemplo:</span></div>
      <div class="lg" id="lg84"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">o PIB não contabiliza o trabalho doméstico e</span></div>
      <div class="lg" id="lg85"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">de cuidado não remunerado, realizado majoritariamente por mulheres.</span></div>
      <div class="lg" id="lg86"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Uma política que aumente esse trabalho invisível pode</span></div>
      <div class="lg" id="lg87"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">aparecer, nos números, como neutra ou até positiva.</span></div>
      <div class="lg" id="lg88"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Então escolher o indicador já é escolher o que conta.</span></div>
      <div class="lg" id="lg89"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">E quem conta.</span></div>
      <div class="lg" id="lg90"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Escolher o que medir, o que priorizar e para quem:</span></div>
      <div class="lg" id="lg91"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">essas são decisões de valor, tomadas antes mesmo de o modelo começar a rodar.</span></div>
      <div class="lg" id="lg92"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Boa parte da economia dominante, chamada de mainstream, parte de uma figura simplificada:</span></div>
      <div class="lg" id="lg93"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">o homo economicus, um indivíduo racional, isolado, que</span></div>
      <div class="lg" id="lg94"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">maximiza sua própria satisfação diante de recursos escassos.</span></div>
      <div class="lg" id="lg95"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Esse é o individualismo metodológico:</span></div>
      <div class="lg" id="lg96"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">explicar os fenômenos sociais a partir das escolhas de indivíduos.</span></div>
      <div class="lg" id="lg97"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Simplificações são úteis;</span></div>
      <div class="lg" id="lg98"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">todo modelo simplifica.</span></div>
      <div class="lg" id="lg99"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">O problema começa quando a simplificação passa a ser tratada como a</span></div>
      <div class="lg" id="lg100"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">própria realidade, e perguntas sobre justiça, poder e</span></div>
      <div class="lg" id="lg101"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">finalidade são deixadas de fora como não econômicas.</span></div>
      <div class="lg" id="lg102"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">É isso que chamamos de reducionismo.</span></div>
      <div class="lg" id="lg103"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">A crítica marxiana vai na raiz desse ponto de partida.</span></div>
      <div class="lg" id="lg104"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Para Marx, o indivíduo isolado não é o começo da história, é um produto dela.</span></div>
      <div class="lg" id="lg105"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Ele ironizava as robinsonadas dos economistas, que imaginavam a economia</span></div>
      <div class="lg" id="lg106"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">a partir de um Robinson Crusoé sozinho em uma ilha.</span></div>
      <div class="lg" id="lg107"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">As pessoas produzem e consomem dentro de relações sociais:</span></div>
      <div class="lg" id="lg108"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">entre trabalhadores e proprietários, entre classes, com conflitos de interesse.</span></div>
      <div class="lg" id="lg109"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Ao tratar preços e mercados como fenômenos naturais, a teoria</span></div>
      <div class="lg" id="lg110"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">esconde que por trás das mercadorias há relações entre pessoas.</span></div>
      <div class="lg" id="lg111"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Marx chamou isso de fetichismo da mercadoria.</span></div>
      <div class="lg" id="lg112"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Então quando o modelo diz todos poderiam estar</span></div>
      <div class="lg" id="lg113"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">melhor, ele está apagando quem ganha e quem perde.</span></div>
      <div class="lg" id="lg114"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Vamos testar tudo isso em um caso hipotético.</span></div>
      <div class="lg" id="lg115"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">O governo tem um bilhão de reais para investir, e quatro opções:</span></div>
      <div class="lg" id="lg116"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">infraestrutura, saúde, educação ou transferência de renda.</span></div>
      <div class="lg" id="lg117"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Rodei as simulações.</span></div>
      <div class="lg" id="lg118"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Infraestrutura gera o maior crescimento no curto prazo.</span></div>
      <div class="lg" id="lg119"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Transferência de renda reduz mais a pobreza agora.</span></div>
      <div class="lg" id="lg120"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Saúde salva mais vidas e reduz doenças.</span></div>
      <div class="lg" id="lg121"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Educação tem os maiores ganhos, mas só daqui a quinze ou vinte anos.</span></div>
      <div class="lg" id="lg122"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">E qual é a melhor?</span></div>
      <div class="lg" id="lg123"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Depende de qual gráfico você olha.</span></div>
      <div class="lg" id="lg124"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Os números são fictícios, mas o dilema é real.</span></div>
      <div class="lg" id="lg125"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Cada gráfico mostra um resultado dentro do modelo, e nenhum deles diz, sozinho, qual escolher.</span></div>
      <div class="lg" id="lg126"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Se eu priorizo crescimento, escolho infraestrutura.</span></div>
      <div class="lg" id="lg127"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Se priorizo quem está passando fome hoje, escolho transferência.</span></div>
      <div class="lg" id="lg128"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Se penso nos meus netos, educação.</span></div>
      <div class="lg" id="lg129"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">E se eu juntar tudo num único índice, com pesos para cada objetivo?</span></div>
      <div class="lg" id="lg130"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">Quem escolhe os pesos?</span></div>
      <div class="lg" id="lg131"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Eu escolho.</span></div>
      <div class="lg" id="lg132"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Ou alguém escolhe.</span></div>
      <div class="lg" id="lg133"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Tá, entendi:</span></div>
      <div class="lg" id="lg134"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">os pesos são valores.</span></div>
      <div class="lg" id="lg135"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">A pergunta qual é a escolha economicamente correta já contém uma escolha ética:</span></div>
      <div class="lg" id="lg136"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">correta segundo qual objetivo, e para quem?</span></div>
      <div class="lg" id="lg137"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Nada disso significa abandonar a economia.</span></div>
      <div class="lg" id="lg138"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Sem ela, não saberíamos quanto custa cada opção, nem quais consequências são prováveis.</span></div>
      <div class="lg" id="lg139"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Os modelos e indicadores são indispensáveis para enxergar a realidade.</span></div>
      <div class="lg" id="lg140"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">O problema não é usar a economia para decidir.</span></div>
      <div class="lg" id="lg141"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">É esquecer que as decisões afetam pessoas, e</span></div>
      <div class="lg" id="lg142"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">tratá-las como se fossem resultados técnicos, neutros, sem autor.</span></div>
      <div class="lg" id="lg143"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Talvez meu trabalho não seja só mostrar os meios.</span></div>
      <div class="lg" id="lg144"><span class="lg-quem" style="color:#1f6fb2">Economista</span><span class="lg-txt">Também é deixar claro quais fins estou assumindo.</span></div>
      <div class="lg" id="lg145"><span class="lg-quem" style="color:#c2541c">Cidadão</span><span class="lg-txt">E abrir espaço para que as pessoas afetadas participem dessa escolha.</span></div>
      <div class="lg" id="lg146"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">A economia é indispensável para compreender o mundo.</span></div>
      <div class="lg" id="lg147"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">Mas seus limites éticos exigem que o economista reflita</span></div>
      <div class="lg" id="lg148"><span class="lg-quem" style="color:#2f8a74">Narradora 2</span><span class="lg-txt">sobre as finalidades, e não apenas sobre os meios.</span></div>
      <div class="lg" id="lg149"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">Então fica a pergunta:</span></div>
      <div class="lg" id="lg150"><span class="lg-quem" style="color:#6b4fa3">Narradora 1</span><span class="lg-txt">a economia pode, sozinha, dizer o que devemos fazer?</span></div>
